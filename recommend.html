<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hall Recommendation</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
  <h1>Hall Recommendation System</h1>

  <nav>
    <a href="./index.html">Home</a>
    <a href="./halls.html">Halls</a>
    <a href="./booking.html">Book Now</a>
    <a href="./recommend.html">Recommend Hall</a>
    <a href="./mybookings.html">My Bookings</a>
    <a href="./contact.html">Contact</a>
  </nav>
</header>

<section class="form-section">
  <h2>Find Best Hall For Your Event</h2>

  <label>Event Type</label>
  <select id="eventType">
    <option value="Wedding">Wedding</option>
    <option value="Birthday">Birthday</option>
    <option value="Corporate">Corporate</option>
  </select>

  <label>Guests Count</label>
  <input type="number" id="guestCount" placeholder="Enter guests count" required>

  <label>Budget (₹)</label>
  <input type="number" id="budget" placeholder="Enter your budget" required>

  <button class="btn" onclick="recommendHall()">Recommend Hall</button>

  <h3 id="recommendResult"></h3>
</section>

<footer>
  <p>© 2026 Online Event Hall Booking Management</p>
</footer>

<script src="script.js"></script>
</body>
</html>
